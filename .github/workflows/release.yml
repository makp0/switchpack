name: Release
on:
  workflow_call:
    inputs:
      tag:
        description: Release Please draft release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: python3 -c 'import json,os; assert os.environ["TAG"] == "v" + json.load(open("package.json"))["version"], "Tag must match package.json version"'
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach checksums and publish the generated draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd artifacts
          sha256sum switchpack-*.tar.gz > SHA256SUMS
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Refusing to replace assets on a published release.' >&2
            exit 1
          fi
          gh release upload "$TAG" switchpack-*.tar.gz SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
